unbind-key %
unbind-key '"'
unbind-key Down
unbind-key Left
unbind-key Right
unbind-key Up
unbind-key r

bind-key c new-window -c "#{pane_current_path}"
bind-key e { new-window vim ~/.config/tmux/tmux.conf }
bind-key h split-window -v -c "#{pane_current_path}"
bind-key r source-file ~/.config/tmux/tmux.conf 
bind-key v split-window -h -c "#{pane_current_path}"

# Switch panes using Alt-jkhl without prefix
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# set-option -ag terminal-features ",xterm-256color:RGB"
# set-option -ag terminal-overrides "*:Ss=\E[%p1%d q:Se=\E[ q"
# set-option -g default-terminal "xterm-256color"
# set-option -g escape-time 300
set-option -g focus-events on
set-option -g mode-keys vi
set-option -g mouse on
set-option -g status-left " #{session_name} "

set-option -g status-style fg=default

set -g base-index 1
set -g clock-mode-style 24
set -g renumber-windows on
set -g status-right " %H:%M %d %b "
set -s copy-command "| pbcopy"
setw -g pane-base-index 1
setw -g status on

# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind P paste-buffer

